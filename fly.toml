# fly.toml file for boalix-sync-server

app = "boalix-sync-server"
primary_region = "sea" # You can change this to your preferred region (e.g., iad, lhr, ams)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false # Keep it always running for instant tracking response
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "boalix_sync_data"
  destination = "/data"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/boalix-sync.db"
  RUST_LOG = "boalix_sync_server=info,warn"
